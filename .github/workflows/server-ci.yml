name: Server CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # cryptography is imported by app/crypto.py but absent from
          # requirements.txt: the add-on image installs it via apk (no armv7
          # musllinux wheel exists), so CI installs it from PyPI instead.
          pip install -r svt_mdm_server/requirements.txt pytest httpx cryptography

      - name: Run tests
        run: |
          cd svt_mdm_server
          pytest -v
